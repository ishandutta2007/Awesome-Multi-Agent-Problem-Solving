<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#080a18" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="centerHighlight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-circle {
        animation: pulseEffect 3.5s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 12;
        animation: flowDash 20s linear infinite;
      }
      .reverse-dash {
        stroke-dasharray: 6, 10;
        animation: flowDashRev 25s linear infinite;
      }
      .node-beacon {
        animation: beaconGlow 2.8s ease-in-out infinite;
      }
      .float-ambient {
        animation: floatMotion 6s ease-in-out infinite alternate;
      }

      @keyframes flowDash {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 400; }
      }
      @keyframes pulseEffect {
        0% { transform: scale(0.96); opacity: 0.55; }
        50% { transform: scale(1.04); opacity: 0.95; }
        100% { transform: scale(0.96); opacity: 0.55; }
      }
      @keyframes beaconGlow {
        0%, 100% { r: 5; opacity: 0.6; }
        50% { r: 8; opacity: 1; }
      }
      @keyframes floatMotion {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowLeft)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowRight)" />
  <rect width="1200" height="380" rx="16" fill="url(#centerHighlight)" />

  <!-- Background Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="230" x2="1200" y2="230" />
    <line x1="0" y1="310" x2="1200" y2="310" />
  </g>

  <!-- Outer Border -->
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Background Multi-Agent Swarm Network (Dynamic Flow) -->
  <g opacity="0.75" class="float-ambient">
    <!-- Agent Node Left 1: Planner -->
    <path d="M 120 100 Q 220 160 310 90 T 520 85" fill="none" stroke="#6366f1" stroke-width="1.8" class="dash-flow" />
    <path d="M 120 100 Q 140 220 160 290" fill="none" stroke="#38bdf8" stroke-width="1.5" class="reverse-dash" />
    <path d="M 160 290 Q 280 250 360 320 T 550 330" fill="none" stroke="#a855f7" stroke-width="1.8" class="dash-flow" />

    <!-- Agent Node Right: Executor / Critic / Aggregator -->
    <path d="M 680 85 Q 860 70 1020 95 T 1110 170" fill="none" stroke="#38bdf8" stroke-width="1.8" class="dash-flow" />
    <path d="M 1110 170 Q 1060 250 1040 300 T 870 330" fill="none" stroke="#6366f1" stroke-width="1.5" class="reverse-dash" />
    <path d="M 1020 95 Q 940 190 870 330" fill="none" stroke="#ec4899" stroke-width="1.6" class="dash-flow" />

    <!-- Left Agent Nodes -->
    <g transform="translate(120, 100)">
      <circle r="22" fill="#4f46e5" fill-opacity="0.18" class="pulse-circle" />
      <circle r="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
      <circle r="4" fill="#a5b4fc" class="node-beacon" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">PLANNER</text>
    </g>

    <g transform="translate(160, 290)">
      <circle r="20" fill="#06b6d4" fill-opacity="0.18" class="pulse-circle" />
      <circle r="11" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
      <circle r="4" fill="#7dd3fc" class="node-beacon" />
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">DECOMPOSER</text>
    </g>

    <g transform="translate(360, 320)">
      <circle r="18" fill="#a855f7" fill-opacity="0.18" class="pulse-circle" />
      <circle r="10" fill="#2e1065" stroke="#a855f7" stroke-width="2" />
      <circle r="3.5" fill="#d8b4fe" class="node-beacon" />
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="600">STIGMERGY</text>
    </g>

    <!-- Right Agent Nodes -->
    <g transform="translate(1020, 95)">
      <circle r="22" fill="#38bdf8" fill-opacity="0.18" class="pulse-circle" />
      <circle r="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
      <circle r="4" fill="#bae6fd" class="node-beacon" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">EXECUTOR</text>
    </g>

    <g transform="translate(1110, 170)">
      <circle r="20" fill="#ec4899" fill-opacity="0.18" class="pulse-circle" />
      <circle r="11" fill="#500724" stroke="#f472b6" stroke-width="2" />
      <circle r="4" fill="#fbcfe8" class="node-beacon" />
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">CRITIC</text>
    </g>

    <g transform="translate(1040, 300)">
      <circle r="20" fill="#10b981" fill-opacity="0.18" class="pulse-circle" />
      <circle r="11" fill="#064e3b" stroke="#34d399" stroke-width="2" />
      <circle r="4" fill="#a7f3d0" class="node-beacon" />
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">VERIFIER</text>
    </g>
  </g>

  <!-- FOREGROUND: Content Elements (Guaranteed Visibility & Foreground Depth) -->
  <g id="foreground-content" transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Category Pill Badge -->
    <g transform="translate(0, 72)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e1b4b" stroke="url(#badgeGrad)" stroke-width="1.4" filter="url(#softGlow)" />
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">
        ⚡ AUTONOMOUS AGENT SWARMS &amp; ORCHESTRATION ⚡
      </text>
    </g>

    <!-- Main Title -->
    <text y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.85))">
      Awesome Multi-Agent Problem Solving
    </text>

    <!-- Subtitle -->
    <text y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2" filter="drop-shadow(0px 2px 6px rgba(0,0,0,0.8))">
      Curated Ecosystem for Distributed Reasoning, Recursive Task Decomposition &amp; Governed Agent Colonies
    </text>

    <!-- Highlights Pill Badges -->
    <g transform="translate(0, 275)">
      <!-- Pill 1: Stigmergy & Coordination -->
      <g transform="translate(-230, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">🐝 Stigmergic Swarms</text>
      </g>

      <!-- Pill 2: Recursive Decomposition -->
      <g transform="translate(0, 0)">
        <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc">🌳 Recursive Decomposition</text>
      </g>

      <!-- Pill 3: Governed Verification -->
      <g transform="translate(230, 0)">
        <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">🛡️ Governed Monologues</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <text y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      OPEN SOURCE REPOSITORIES • PRODUCTION SAAS PLATFORMS • CONSTANTLY UPDATED
    </text>
  </g>
</svg>
